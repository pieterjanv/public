<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pieter Jan Visser's public works</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #172554;
			background: #f1f5f9;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 2rem;
			/* background:
				radial-gradient(ellipse at 15% 15%, #dbeafe 0, transparent 40%),
				radial-gradient(ellipse at 85% 85%, #e0e7ff 0, transparent 38%),
				#f8fafc; */
		}

		main {
			width: min(100%, 36rem);
			padding: clamp(2rem, 7vw, 4rem);
			text-align: center;
			background: rgb(255 255 255 / 88%);
			border: 1px solid #e2e8f0;
			/* border-radius: 1.5rem; */
			box-shadow: 0 24px 60px rgb(15 23 42 / 9%);
		}

		.icon {
			width: 4rem;
			height: 4rem;
			margin: 0 auto 1.75rem;
			display: grid;
			place-items: center;
			font-size: 1.75rem;
			/* background: #eff6ff; */
			/* border-radius: 1.25rem; */
		}

		.label {
			margin: 0 0 1rem;
			color: #2563eb;
			font-size: .75rem;
			font-weight: 700;
			letter-spacing: .14em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: #0f172a;
			font-size: clamp(2rem, 7vw, 3.25rem);
			letter-spacing: -.045em;
			line-height: 1.1;
		}

		.description {
			max-width: 27rem;
			margin: 1.25rem auto 0;
			color: #64748b;
			font-size: 1.05rem;
			line-height: 1.7;
		}
	</style>
</head>
<body>
	<main>
		<div class="icon" aria-hidden="true">🛠️</div>
		<h1>Under construction</h1>
		<p class="description">Slow and steady.</p>
	</main>
</body>
</html>
